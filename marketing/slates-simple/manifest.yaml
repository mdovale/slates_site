# Marketing slate pack metadata — simple (App Store / compact window).
# Bodies live in sibling *.md files. Rebuild with:
#   python3 scripts/build_marketing_slates.py
# or: make marketing-slates
#
# IDs and updatedAt are frozen so rebuilds do not churn git.
# primaryCycleID accepts a built-in alias (task, traffic-light, kanban, …)
# or a UUID. Omit or use null to keep the app default (Task on a clean install).
#
# Color identity is left to the default palette slot for each index.
# Do not set colorIndex unless a specific shot needs an override.
#
# Keep bodies short enough for a compact window, but not stubby.
# The elaborate desk pack lives in ../slates/.

slates:
  - index: 0
    slug: next-week
    title: Next week
    file: 01-next-week.md
    id: "5A5A5A5A-0000-4000-A000-000000000001"
    updatedAt: "2026-09-20T21:00:00Z"
    textMode: rich
    language: auto
    fontStyle: regular
    textSizePreset: regular
    lineSpacingPreset: normal
    fontName: Georgia
